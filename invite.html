<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07060f">
  <meta http-equiv="refresh" content="0;url=https://discord.com/oauth2/authorize?client_id=1512007176678281246&permissions=8&scope=bot%20applications.commands">
  <title>Invite kn4ght security</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07060f;
      --panel: #0f0d1e;
      --line: rgba(150,140,255,.16);
      --text: #eae8f7;
      --dim: #9792b8;
      --blue: #5b7fff;
      --purple: #a65bff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      padding: 24px; color: var(--text); background: var(--bg);
      background-image:
        radial-gradient(ellipse at 12% 8%, rgba(91,127,255,.2), transparent 42%),
        radial-gradient(ellipse at 88% 92%, rgba(166,91,255,.18), transparent 42%);
    }
    main {
      width: min(100%, 440px); padding: 38px 28px; text-align: center;
      background: rgba(15,13,30,.88); border: 1px solid var(--line);
      border-radius: 20px; box-shadow: 0 24px 80px rgba(0,0,0,.3);
    }
    .mark {
      width: 58px; height: 58px; margin: 0 auto 22px; display: grid;
      place-items: center; border-radius: 17px; font-size: 25px; font-weight: 800;
      color: #080713; background: linear-gradient(135deg,var(--blue),var(--purple));
    }
    .eyebrow { color: var(--blue); font: 12px Consolas, monospace; letter-spacing: .12em; }
    h1 { margin: 12px 0; font-size: 30px; letter-spacing: -.03em; }
    p { color: var(--dim); font-size: 14px; line-height: 1.7; }
    a {
      display: inline-block; margin-top: 18px; padding: 13px 20px; border-radius: 9px;
      color: #080713; background: linear-gradient(110deg,var(--blue),var(--purple));
      text-decoration: none; font-weight: 700;
    }
    .back { display: block; margin-top: 22px; color: var(--dim); font-size: 13px; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="mark">K</div>
    <div class="eyebrow">KN4GHT SECURITY</div>
    <h1>Taking you to Discord</h1>
    <p>You are being redirected to the official Discord authorization page to invite kn4ght security to your server.</p>
    <a href="https://discord.com/oauth2/authorize?client_id=1512007176678281246&permissions=8&scope=bot%20applications.commands">Continue to Discord</a>
    <a class="back" href="./index.html">Back to kn4ght security</a>
  </main>
  <script>
    window.location.replace("https://discord.com/oauth2/authorize?client_id=1512007176678281246&permissions=8&scope=bot%20applications.commands");
  </script>
</body>
</html>
